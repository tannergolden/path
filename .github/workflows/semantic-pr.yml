# Installed from tannergolden/standards. Edit freely: this file is YOURS.
#
# The required pull request check, in a file of its own: the title, the
# branch name, every commit message and the DCO sign-off, read through the
# API.
#
# ⚠️ IT HAS A FILE OF ITS OWN SO EACH PULL REQUEST LISTS IT ONCE. GitHub
# lists every job of a run on the pull request, a skipped one included.
# Kept beside the triage in `governance.yml`, which runs on
# `pull_request_target`, this check appeared a second time, skipped, on
# every pull request. Here nothing else triggers the file.
#
# ⚠️ THE `pr` JOB ID IS A CHECK NAME. It reports as 'pr / ✍️ DCO Sign-Off',
# which branch protection names. Renaming it leaves every pull request
# waiting on a check that never reports. The file it lives in does not
# matter, so if you keep a `governance.yml` of your own that still has a
# `pr` job, delete that job, or the check runs twice.

name: '✨ Semantic Pull Request'

on:
  # `edited` re-validates a corrected title. A fork's pull request runs it
  # with a read-only token, which is all it needs - and, like every check on
  # `pull_request`, it runs the workflow as the pull request has it, so a
  # change to this file is reviewed like any other.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # A merge queue asks every required check to report on the group as well.
  # A merge group has no pull request in it, so the called jobs skip their
  # checks, which already ran on the pull request, and GitHub counts a
  # skipped job as passing.
  merge_group:

concurrency:
  # One group per pull request, and one per merge group: github.ref is
  # refs/pull/<number>/merge on the first and the queue's branch on the
  # second.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# ⚠️ THE `permissions:` BELOW IS A CEILING, NOT A GRANT. The called workflow
# may request no more than the job declares here, and anything beyond it
# fails the run before a single job starts, with no log to read. They are
# written out rather than left to the repository's default token
# permissions, which a read-only default would cap the same invisible way.
# 🔬 Verify Stub Ceilings holds them to what the called workflow declares.

permissions: {}

jobs:
  # RULESET-LOAD-BEARING JOB ID: reports as 'pr / ✍️ DCO Sign-Off'.
  #
  # Runs everywhere, templates included: a change to a template needs a
  # sign-off as much as a change to anything built from it. Never give it an
  # `if:`. A caller job skipped here reports under its bare id, `pr`, which
  # is not the name branch protection waits for.
  pr:
    permissions:
      pull-requests: read # read the PR title under validation
    uses: tannergolden/standards/.github/workflows/semantic-pr.yml@v1
