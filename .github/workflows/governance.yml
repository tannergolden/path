# Installed from tannergolden/standards. Edit freely: this file is YOURS.
#
# Everything that REACTS to humans, in one file: pull request title and
# sign-off validation, onboarding and triage, the stale sweep, and the
# slash commands in issue comments.
#
# TWO KINDS OF TRIGGER, ON PURPOSE. The `pr` job only reads - the title and
# the commits, through the API - so it runs on the unprivileged
# `pull_request`. The `governance` and `issue-ops` jobs write labels and
# comments, so they run on privileged triggers (`pull_request_target`,
# comments), and NONE of them checks out or executes pull-request code: they
# read and write through the API. That is what makes them safe; do not add a
# job here that checks out a pull request's head.
#
# ⚠️ GITHUB'S DEFAULT POLICY BLOCKS `pull_request_target` IN A PUBLIC
# REPOSITORY that has no Actions event policy allowing it, from 2 December
# 2026 at the latest. Only the `governance` job uses it, for the pull request
# triage and the first-time welcome, so the required `pr` check is
# unaffected either way. 🎯 Apply Standards writes the policy with its
# settings job; or add one by hand under Settings → Actions → Policies,
# scoped to this file. An event rule is an allowlist, so it must name every
# event in `on:` below. Add a trigger here and add it to the policy too,
# through `actions.event_policy` in a settings override, or the next
# settings run puts the policy back without it.
#
# ⚠️ THE `pr` JOB ID IS A CHECK NAME. It reports as 'pr / ✍️ DCO Sign-Off',
# which branch protection names. Renaming it leaves every pull request
# waiting on a check that never reports.

name: '⚖️ Governance'

on:
  # The required title and sign-off check. `edited` re-validates a corrected
  # title. A fork's pull request runs it with a read-only token, which is all
  # it needs - and, like every check on `pull_request`, it runs the workflow
  # as the pull request has it, so a change to this file is reviewed like
  # any other.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # A merge queue asks every required check to report on the group as well.
  # A merge group has no pull request in it, so the called jobs skip their
  # checks, which already ran on the pull request, and GitHub counts a
  # skipped job as passing.
  merge_group:
  # Triage and the first-time welcome, which write labels and comments on a
  # fork's pull request and so need the privileged trigger.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 4 * * 1' # start-of-week triage, and the label sync
  workflow_dispatch:

concurrency:
  # Keyed per pull request or issue: under pull_request_target github.ref is
  # the BASE branch, so a branch-keyed group would put every open pull
  # request into one queue slot. The event is part of the key, so the check
  # and the triage for one pull request never wait on each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

# ⚠️ THE `permissions:` BELOW IS A CEILING, NOT A GRANT. For a job that calls a
# reusable workflow, the caller's permissions cap what the called workflow may
# request. Anything it asks for beyond them fails the run before a single job
# starts: a startup failure, with no job, no step, and no log to read.
#
# They are written out rather than left to this repository's DEFAULT token
# permissions, because a repository set to read-only - now the common default -
# caps every write scope the same invisible way.
#
# Each job declares the union of what ITS called workflow's jobs ask for, and
# nothing more - grouping the callers into one file does not widen any of
# them. Widen one only to match a scope its called workflow actually declares.

permissions: {}

jobs:
  # RULESET-LOAD-BEARING JOB ID: reports as 'pr / ✍️ DCO Sign-Off'.
  #
  # Runs everywhere, the golden path template included: a change to a
  # template needs a sign-off as much as a change to anything built from it.
  pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      pull-requests: read # read the PR title under validation
      statuses: write # publish the semantic-title status check on the PR
    uses: tannergolden/standards/.github/workflows/semantic-pr.yml@v1

  governance:
    # Pull request triage, onboarding, the stale sweep and the label sync.
    # The called workflow gates its own jobs by event: triage on pull
    # requests, onboarding on first interactions, the sweep on the schedule.
    #
    # Inert in the golden path template, and live in every other
    # repository, a template derived from it included: `is_template` alone
    # is true there too, so the guard also names it.
    if: ${{ !(github.event.repository.is_template && github.event.repository.name == 'path') && contains(fromJSON('["pull_request_target", "issues", "schedule", "workflow_dispatch"]'), github.event_name) }}
    permissions:
      contents: read # read the labeler rules
      issues: write # post the welcome on issues
      pull-requests: write # post the welcome on pull requests
    uses: tannergolden/standards/.github/workflows/governance.yml@v1

  issue-ops:
    # Slash commands in issue comments - /assign, /label, /close and the
    # rest. Anything unrecognised is left alone.
    #
    # Inert in the golden path template, and live in every other
    # repository, a template derived from it included: `is_template` alone
    # is true there too, so the guard also names it.
    if: ${{ github.event_name == 'issue_comment' && !(github.event.repository.is_template && github.event.repository.name == 'path') }}
    permissions:
      issues: write # apply the command's label and assignment changes
    uses: tannergolden/standards/.github/workflows/issue-ops.yml@v1
