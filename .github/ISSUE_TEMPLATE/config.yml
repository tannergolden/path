# .github/ISSUE_TEMPLATE/config.yml
#
# Purpose: steer reporters into the right template, and keep vulnerability
# reports PRIVATE.
#
# ⚠️ THE URL BELOW CARRIES A PLACEHOLDER, AND INITIALISATION REPLACES IT.
# GitHub never substitutes placeholders in contact links and there is no
# expression syntax here, so a contact link either names a real repository or
# it 404s. The placeholder is visibly wrong on purpose: if initialisation is
# skipped, a link that fails loudly beats one quietly pointing at somebody
# else's discussions - and once .github/TEMPLATE_INIT is gone, the repository
# validator fails the `ci` check until it is replaced.
#
# There is deliberately NO security contact link. GitHub adds "Report a
# vulnerability" to this chooser on its own once private vulnerability
# reporting is enabled (Settings → Advanced Security → Private vulnerability
# reporting), and this repository ships its own SECURITY.md and the private
# report form, .github/VULNERABILITY_REPORT.yml. A hand-written link would
# duplicate that and go stale.
#
# NOTE: the "Vulnerability Report" issue form beside this file is for PRIVATE
# repositories only, and initialisation deletes it from a public one. On a
# public repository, reporters use the private intake above rather than an
# issue anyone could read.

blank_issues_enabled: false

contact_links:
  # 💬 Questions belong in Discussions. With blank issues disabled, this is
  # the chooser's path for how-to asks (SUPPORT.md routes them here too).
  #
  # ⚠️ `about:` IS RENDERED TO EVERY REPORTER, under the link, in the chooser.
  # It is not a comment. Keep maintainer instructions up here, where they are
  # read by the person who can act on them - the two sentences that used to
  # sit in `about` told the public to replace a placeholder they cannot see
  # and to change a repository setting they do not have.
  #
  # The url below is rewritten for you: it carries a placeholder that
  # initialisation substitutes for this repository, because GitHub itself
  # substitutes nothing in a contact link and there is no expression syntax
  # here to do it with.
  #
  # What IS left for you: if the link 404s, enable Discussions under
  # Settings → General → Features. That is a repository setting rather than
  # a file, so no workflow can switch it on.
  - name: 💬 Questions, Ideas & Support (Discussions)
    url: 'https://github.com/OWNER/REPOSITORY/discussions'
    about: 'How-to questions, tooling setup, and ideas belong in Discussions rather than the issue tracker.'
