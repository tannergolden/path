# =============================================================================
# Dependabot - automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# =============================================================================
# GitHub reads this file ONLY from the repository that owns it, so unlike the
# workflows it cannot be shared and has to live here.
#
# ⚠️ ONLY THE THREE ECOSYSTEMS THIS TEMPLATE SHIPS ARE ENABLED, because they
# are the only manifests it can be sure exist: the workflows
# (`github-actions`), the development container (`devcontainers`), and the
# one Python package the repository scripts need (`pip`, in
# .github/scripts/requirements.txt). A `package-ecosystem` pointing at a
# manifest that is not there produces a standing error on the Dependabot tab
# rather than being quietly ignored, so the language ecosystems are commented
# out below for you to enable as you add them - and if you delete one of the
# three, delete its block too.
#
# EVERY ECOSYSTEM WAITS THREE DAYS before proposing a new version. That is
# GitHub's default; `cooldown` states it here so the number is visible, yours
# to change, and kept should the default change. The wait is what stands
# between a release that turns out to be malicious, which is usually pulled
# within hours, and `dependabot-automerge.yml`, which would otherwise merge a
# patch the day it appears. Security updates ignore the cooldown and arrive at
# once.
#
# Pair this with the `dependabot-automerge` stub from tannergolden/standards
# and patch and minor updates approve and merge themselves once your required
# checks pass. Majors still wait for a human.
#
# EVERY UPDATE IS A CONVENTIONAL COMMIT. `commit-message.prefix` makes
# Dependabot title its pull requests `build(deps): ...` rather than its default
# "Bump x from 1 to 2". That matters for two reasons:
#
#   1. On a squash merge the pull request TITLE becomes the commit that lands.
#      The default is not a Conventional Commit, so every merged update would
#      put a non-conforming message into permanent history.
#   2. Changelog generation parses those messages. A non-conforming one is
#      silently dropped, so dependency updates would be missing from your
#      release notes entirely.
#
# `build` is the Conventional Commits type for changes to the build system or
# external dependencies. Keep it on any ecosystem you enable below.
# =============================================================================

version: 2
updates:
  # Keeps the pinned action SHAs in your workflow stubs current. Correct for
  # every repository from the moment it is generated, whatever language it is
  # written in.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      # Monthly, not weekly. Grouped updates make the cadence the only
      # remaining source of noise, and a pin that is four weeks old is not a
      # problem worth a weekly interruption. `day` is a weekly-only key and is
      # dropped here; monthly runs on the first of the month.
      interval: 'monthly'
      time: '07:00'
      timezone: 'Etc/UTC'
    # Actions accept only `default-days`; the per-semver keys are refused.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    labels:
      - 'type: build'
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'
      # A group applies to version updates unless it says otherwise, so
      # security fixes would each open a pull request of their own.
      github-actions-security:
        applies-to: 'security-updates'
        patterns:
          - '*'

  # Keeps the features in .devcontainer/devcontainer.json current.
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '07:00'
      timezone: 'Etc/UTC'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    labels:
      - 'type: build'
      - 'dependencies'
    groups:
      devcontainers:
        patterns:
          - '*'

  # Keeps the repository scripts' one dependency, PyYAML, current. Delete this
  # block if you delete .github/scripts/requirements.txt.
  - package-ecosystem: 'pip'
    directory: '/.github/scripts'
    schedule:
      interval: 'monthly'
      time: '07:00'
      timezone: 'Etc/UTC'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    labels:
      - 'type: build'
      - 'dependencies'
    groups:
      repository-scripts:
        patterns:
          - '*'
      repository-scripts-security:
        applies-to: 'security-updates'
        patterns:
          - '*'

  # --- Enable the ones your project actually uses -------------------------
  #
  # Copy the first block above - INCLUDING the commit-message block, or that
  # ecosystem's updates will not be Conventional Commits - change
  # `package-ecosystem`, and point `directory` at the folder holding the
  # manifest. Language ecosystems also accept `semver-major-days`,
  # `semver-minor-days` and `semver-patch-days` under `cooldown`:
  #
  #   npm       package.json          pip        pyproject.toml
  #   cargo     Cargo.toml            gomod      go.mod
  #   maven     pom.xml               gradle     build.gradle
  #   nuget     *.csproj              bundler    Gemfile
  #   composer  composer.json         docker     Dockerfile
  #
  # The full list is in the documentation linked at the top of this file.
