# Installed from tannergolden/standards. Edit freely: this file is YOURS.
#
# Keeps every machined index in this repository current: each folder's
# README log, the decision index among them, and the indexes in README.md. The
# generator, the action that ships it and the workflow that runs it all live
# in the standards, so a fix to how an index is drawn arrives here without a
# pull request.
#
# It runs after a push to the default branch and proposes whatever changed
# as one evolving pull request on `docs/auto-index`, never as a push to your
# branch. A push that left every index current changes nothing.
#
# ⚠️ THIS RUNS IN THE TEMPLATE ITSELF, like 🧹 Prune Run History and
# 🔬 Verify Stub Ceilings. A template's own folder logs need keeping as much
# as any generated repository's, so there is no is_template guard here.
#
# ⚠️ THE DEFAULT TOKEN CANNOT PUSH THE README IN .github/workflows/. Without
# a BOT_ACCESS_TOKEN that one log is left as it was and the pull request says
# so; every other index still lands.

name: '🗂️ Machined Indexes'

on:
  push:
  workflow_dispatch:

concurrency:
  # Only the newest tree needs indexing, so superseding an in-flight run is
  # correct here, unlike a required check.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ THE `permissions:` BELOW IS A CEILING, NOT A GRANT. For a job that calls a
# reusable workflow, the caller's permissions cap what the called workflow may
# request. Anything it asks for beyond them fails the run before a single job
# starts: a startup failure, with no job, no step, and no log to read.
#
# They are written out rather than left to this repository's DEFAULT token
# permissions, because a repository set to read-only - now the common default -
# caps every write scope the same invisible way.
#
# The list is the union of what the called workflow's own jobs ask for, and
# each of those jobs still narrows it further from there. Widen it only to
# match a scope the called workflow actually declares.

permissions: {}

jobs:
  index:
    # A direct push runs only on the default branch, WHATEVER IT IS
    # CALLED - resolved at run time rather than written into this file, so
    # renaming your default branch cannot silently stop this workflow.
    if: ${{ github.event_name != 'push' || github.ref_name == github.event.repository.default_branch }}
    permissions:
      contents: write # push the regenerated topic branch (PR-only flow)
      pull-requests: write # open or update the index pull request
    uses: tannergolden/standards/.github/workflows/auto-index.yml@v1
    secrets: inherit # zizmor: ignore[secrets-inherit] - first-party callee at the ref pinned above.
